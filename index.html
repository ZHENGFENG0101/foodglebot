<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Scan item</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 10px;
             background: #2481cc; color: #fff; }
  </style>
</head>
<body>
  <h3>Scan an item QR code</h3>
  <button id="scan">📷 Open camera</button>
  <p id="msg"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function scan() {
      tg.showScanQrPopup({ text: "Point at the item QR code" }, (text) => {
        // text is whatever the QR contains, e.g. https://t.me/Bot?start=T0001 or T0001
        const m = text.match(/start=([A-Za-z0-9_-]+)/);
        const sku = m ? m[1] : text.trim();
        tg.closeScanQrPopup();
        tg.sendData(sku);   // sends the SKU to the bot and closes the Mini App
        return true;
      });
    }

    document.getElementById("scan").onclick = scan;
    scan(); // open the camera immediately
  </script>
</body>
</html>
